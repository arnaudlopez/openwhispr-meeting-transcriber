name: Proposer une amélioration
description: Suggérer une évolution du pipeline, de la diarisation ou de la micro-app
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: Quel problème concret cette évolution résoudrait-elle ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solution proposée
      description: Décrivez le comportement souhaité et les compromis connus.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: checkboxes
    id: privacy
    attributes:
      label: Vérification de confidentialité
      options:
        - label: Cette proposition ne contient aucune clé API ni donnée de réunion privée.
          required: true
