name: Signaler un bug
description: Décrire un problème reproductible dans l’application ou le pipeline
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Merci de retirer les clés API, noms réels, transcriptions et extraits audio avant
        de publier. Pour une vulnérabilité, utilisez le signalement privé de SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problème observé
      description: Décrivez le résultat obtenu et le résultat attendu.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Lancer…
        2. Choisir…
        3. Observer…
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version ou commit
      placeholder: main / abc1234
  - type: input
    id: macos
    attributes:
      label: Version de macOS et machine
      placeholder: macOS 15, MacBook Pro M3
  - type: textarea
    id: logs
    attributes:
      label: Journaux nettoyés
      description: Collez uniquement les lignes utiles après avoir supprimé toute donnée sensible.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Vérification de confidentialité
      options:
        - label: J’ai retiré les secrets et les données de réunion de ce rapport.
          required: true
